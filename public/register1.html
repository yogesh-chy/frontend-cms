<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Register</title>
  <link rel="stylesheet" href="/global.css" />
  <link rel="stylesheet" href="/register1.css" />
</head>
<body>

  <div class="register-box">
    <h1>Student Register</h1>
    <p>Create your student portal account</p>

    <input id="regName" type="text" placeholder="Full Name" />
    <input id="regUsername" type="text" placeholder="Username" />
    <input id="regEmail" type="email" placeholder="Email Address" />
    <input id="regPassword" type="password" placeholder="Password" />

    <button id="registerBtn">Create Account ✨</button>

    <div class="demo">
      Example Username: <b>student123</b>
    </div>

    <p class="link-text">
      Already have an account?
      <a href="/login1.html">Login</a>
    </p>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
